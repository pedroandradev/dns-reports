name: Python tests and shell syntax

on:
  push:
    branches: [main, "refactor/**", "fix/**", "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Shell syntax
        run: |
          for script in Instalar-DNS-Reports-Proxmox.sh scripts/proxmox/install.sh scripts/proxmox/lib/ui.sh; do
            bash -n "$script"
          done
      - name: Install Nginx for HTTPS integration tests
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: pytest -q
