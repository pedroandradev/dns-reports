# VPN CIDRs are added before deny all by configure_access.py.
# Existing LAN rules remain in place; see docs/VPN.md.
server {
    listen 80 default_server;
    server_name _;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/dnsreports.crt;
    ssl_certificate_key /etc/nginx/ssl/dnsreports.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 130s;
    }
}
